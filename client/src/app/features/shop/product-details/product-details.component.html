@if (product()) {
    <section class="py-8">
        <div class="max-w-screen-2xl px-4 mx-auto">
            <div class="grid grid-cols-2 gap-8">
                <div class="max-w-xl mx-auto">
                    <img class="w-full" [src]="product()!.pictureUrl" (error)="$event.target.src='/images/placeholder.png'" alt="{{product()!.name}}">
                </div>
                <div>
                    <h1 class="text-2xl font-semibold text-gray-900">{{product()!.name}}</h1>
                    <p>Vous avez {{quantityInCart()}} fois cet article dans votre panier</p>
                    <div class="mt-4 items-center gap-4 flex">
                        <p class="text-3xl font-extrabold text-gray-900">{{product()!.price | currency: 'EUR'}}</p>
                    </div>
                    @if (hasSizes()) {
                        <mat-form-field appearance="outline" class="flex mt-4">
                            <mat-label>Taille</mat-label>
                            <mat-select [ngModel]="selectedSize()" (ngModelChange)="onSizeChange($event)">
                                @for (size of product()!.sizes; track size) {
                                    <mat-option [value]="size">{{size}}</mat-option>
                                }
                            </mat-select>
                        </mat-form-field>
                    }
                    <div class="flex gap-4 mt-6">
                        <button [disabled]="!canUpdateCart()" (click)="updateCart()" mat-flat-button class="min-h-14">
                            <mat-icon>shopping_cart</mat-icon>
                            {{getButtonText()}}
                        </button>
                        <mat-form-field appearance="outline" class="flex">
                            <mat-label>Quantité</mat-label>
                            <input matInput min="0" [ngModel]="quantity()" (ngModelChange)="quantity.set($event)" type="number">
                        </mat-form-field>
                    </div>
                    <mat-divider></mat-divider>
                    <p class="mt-6 text-gray-500">{{product()!.description}}</p>
                </div>
            </div>
        </div>
    </section>
}
